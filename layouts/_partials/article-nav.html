{{ if or .PrevInSection .NextInSection }}
    <nav class="mt-12 grid gap-8 border-t border-rule pt-8 text-sm sm:grid-cols-2">
    <div>
        {{ with .PrevInSection }}
        <a href="{{ .RelPermalink }}" class="group block hover:text-cobalt">
            <span class="text-mute">{{ T "previous" }}</span>
            <span class="mt-1 block font-display text-lg font-medium tracking-normal">{{ .Title }}</span>
        </a>
        {{ end }}
    </div>
    <div class="sm:text-right">
        {{ with .NextInSection }}
        <a href="{{ .RelPermalink }}" class="group block hover:text-cobalt">
            <span class="text-mute">{{ T "next" }}</span>
            <span class="mt-1 block font-display text-lg font-medium tracking-normal">{{ .Title }}</span>
        </a>
        {{ end }}
    </div>
    </nav>
{{ end }}
