<header class="flex justify-end py-7">
    <nav class="flex gap-6 text-sm">
        {{ with site.GetPage "/articles" }}
            <a href="{{ .RelPermalink }}" class="font-display font-semibold hover:text-cobalt">{{ T "blog" | title }}</a>
        {{ end }}
        {{ with site.GetPage "/topics" }}
            <a href="{{ .RelPermalink }}" class="font-display font-semibold hover:text-cobalt">{{ T "topics" | title }}</a>
        {{ end }}
    </nav>
</header>
