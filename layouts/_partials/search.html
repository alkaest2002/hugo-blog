{{- $title := T "searchTitle" | default "Search" }}
{{- $close := T "close" | default "Close" }}

<div id="search" x-data="{
    init() {
      this.$watch('$store.search.searchPanelOpen', (open) => open ? this.onOpen() : this.onClose());
    },
    get open() {
      return this.$store.search.searchPanelOpen;
    },
    close() {
      this.$store.search.searchPanelOpen = false;
    },
    onOpen() {
      document.documentElement.style.overflow = 'hidden';
      this.$store.search.lastFocusedElement = document.activeElement;
      const input = this.$el.querySelector('pagefind-input');
      if (input) customElements.whenDefined('pagefind-input').then(() => input.focus());
    },
    onClose() {
      document.documentElement.style.overflow = '';
      const last = this.$store.search.lastFocusedElement;
      if (last instanceof HTMLElement) last.focus();
    },
    onKeydown(event) {
      if (event.key === 'Escape' && this.open && !event.target.closest('pagefind-input')) this.close();
      if (event.key === 'k' && (event.metaKey || event.ctrlKey)) {
        event.preventDefault();
        this.$store.search.searchPanelOpen = !this.open;
      }
    },
  }"
  :data-open="open ? '' : false"
  :aria-hidden="!open"
  @keydown.window="onKeydown($event)"
  @click="$event.target.closest('a[href]') && close()"
  class="group/search invisible fixed inset-0 z-100 data-[open]:visible"
  role="dialog" aria-modal="true" aria-label="{{ $title }}" aria-hidden="true">

  <div @click="close()" aria-hidden="true"
    class="absolute inset-0 bg-void/30 opacity-0 backdrop-blur-sm transition-opacity duration-200 group-data-[open]/search:opacity-100">
  </div>
  <div
    class="absolute inset-y-0 right-0 flex h-dvh w-full max-w-md translate-x-full flex-col border-l border-rule bg-paper shadow-2xl shadow-ink/20 transition-transform duration-300 ease-out group-data-[open]/search:translate-x-0">

    <div class="flex shrink-0 items-center justify-between gap-4 border-b border-rule px-5 py-4">
      <h2 class="font-display text-base font-semibold tracking-tight">{{ $title }}</h2>
      <button type="button" @click="close()" aria-label="{{ $close }}"
        class="flex size-9 items-center justify-center rounded-lg text-mute transition-colors hover:bg-rule/50 hover:text-cobalt">
        <svg class="size-5" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <pagefind-config bundle-path="{{ "pagefind/" | relURL }}"></pagefind-config>

    <div class="shrink-0 px-5 py-4">
      <pagefind-input class="block" placeholder="{{ T "search" }}" ref="searchInput" ></pagefind-input>
      <pagefind-summary class="block text-xs text-mute" style="margin-top:12px"></pagefind-summary>
    </div>
    <div class="min-h-0 grow overflow-y-auto overscroll-contain px-5 pb-6">
      <pagefind-results class="block"></pagefind-results>
    </div>

  </div>
</div>
