<header class="pt-8 pb-10 sm:pt-16">
    <div class="flex gap-3 text-sm text-mute">
        {{ with .Date }}
            <time datetime="{{ .Format "2006-01-02" }}" class="tabular-nums">{{ time.Format ":date_full" . }}</time>
        {{ end }}
        <span aria-hidden="true">/</span>
        <span>{{ T "readingTime" .ReadingTime }}</span>
    </div>
    <h1 class="mt-4 font-display text-4xl font-semibold tracking-wide sm:text-6xl">{{ .Title }}</h1>
        {{ with .Description }}
            <p class="mt-4 text-lg text-mute">{{ . }}</p>
        {{ end }}
</header>

<div class="prose-lg fullwidth prose-neutral pt-3 prose-headings:font-display prose-headings:tracking-normal prose-a:text-cobalt prose-a:underline-offset-4 prose-code:rounded prose-code:bg-ink/5 prose-code:px-1.5 prose-code:py-0.5 prose-code:font-normal prose-code:before:content-none prose-code:after:content-none prose-pre:bg-ink prose-pre:text-paper [&_blockquote_p]:before:content-none [&_blockquote_p]:after:content-none">
    {{ partial "toc.html" . }}
    {{ .Content }}
</div>
