{{ define "title" }}
    {{ .Title }} &middot; {{ site.Title }}
{{ end }}
{{ define "main" }}

    <h1 class="mt-4 font-display text-4xl font-semibold tracking-wide sm:text-6xl">{{ .Title }}</h1>
    {{ with .Description }}
        <p class="mt-4 text-lg text-mute">{{ . }}</p>
    {{ end }}

    <div class="prose prose-neutral max-w-[68ch] border-t border-rule pt-10 prose-headings:font-display prose-headings:tracking-normal prose-a:text-cobalt prose-a:underline-offset-4 prose-code:rounded prose-code:bg-ink/5 prose-code:px-1.5 prose-code:py-0.5 prose-code:font-normal prose-code:before:content-none prose-code:after:content-none prose-pre:bg-ink prose-pre:text-paper [&_blockquote_p]:before:content-none [&_blockquote_p]:after:content-none">
        {{ .Content }}
    </div>

{{ end }}
